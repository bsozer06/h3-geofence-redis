services:
  # Redis Servisimiz
  redis_db:
    image: redis:alpine
    container_name: redis_geofence
    ports:
      - "6379:6379"
    restart: always

  # Bizim TypeScript Uygulamamız
  geofence_app:
    build: .
    container_name: geofence_service
    depends_on:
      - redis_db
    environment:
      - REDIS_HOST=redis_db # Dikkat: Localhost yerine servis ismini yazıyoruz!
      - REDIS_PORT=6379
    restart: on-failure